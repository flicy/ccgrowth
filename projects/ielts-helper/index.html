<noscript><main><h1>IELTS 7 · 雅思学习工作台</h1><p>把每日学习任务、12 周计划、复盘和打卡放在同一个地方。</p><h2>适合谁 / Audience</h2><p>需要把雅思备考计划落实到每日行动的学习者。</p><p>IELTS learners who want to turn a preparation plan into daily actions.</p><h2>怎么用 / How it works</h2><p>选择周次 → 查看今日任务与材料 → 完成勾选 → 填复盘 → 生成打卡文案。</p><p>Choose a week → open daily tasks and materials → mark work complete → reflect → generate a check-in.</p><p>当前为个人学习工具；目标分数是计划目标，不代表提分效果。</p><a href="https://flicy.github.io/ielts-helper/">打开产品 / Open product</a></main></noscript>
