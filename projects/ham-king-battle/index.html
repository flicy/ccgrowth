<noscript><main><h1>烧鹅腿鉴定局</h1><p>25 秒，从 12 张图片里找出真正的烧鹅腿，和朋友来一场鉴腿对决。</p><h2>适合谁 / Audience</h2><p>想与朋友轻松互动、分享小游戏的人。</p><p>People who want a quick, shareable game with friends.</p><h2>怎么用 / How it works</h2><p>发起房间或离线试玩 → 从图片中选择 → 固定答案评分 → 查看与分享结果。</p><p>Start a room or offline demo → select images → score against fixed answers → view and share the result.</p><p>在线房间需要后端部署；AI 判词是可选项，未配置时可使用模板。</p><a href="https://github.com/flicy/ham-king-battle">打开产品 / Open product</a></main></noscript>
