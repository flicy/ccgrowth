<noscript><main><h1>从逐字稿到内容发布</h1><p>把一份访谈或直播逐字稿，整理成文章、配图方案和多平台内容包。</p><h2>适合谁 / Audience</h2><p>内容运营、播客主理人与做直播复用的小团队。</p><p>Content teams, podcasters and teams repurposing livestreams.</p><h2>怎么用 / How it works</h2><p>逐字稿 → 亮点评分与证据映射 → 公众号稿 → 配图与排版 → 草稿预检与社交内容包。</p><p>Transcript → score highlights and map evidence → WeChat draft → visuals and formatting → preflight and social pack.</p><p>公开仓库提供安装与使用方式；需要在兼容的 Agent 或本地环境中运行。</p><a href="https://github.com/flicy/wechat-publish-from-transcript">打开产品 / Open product</a></main></noscript>
