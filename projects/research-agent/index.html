<noscript><main><h1>企业调研 Agent</h1><p>把公司与产品的公开资料整理成可复核的证据和决策建议。</p><h2>适合谁 / Audience</h2><p>需要做供应商筛选、合作评估与竞品研究的业务团队。</p><p>Teams assessing suppliers, partnerships or competitors.</p><h2>怎么用 / How it works</h2><p>提供对象与决策问题 → 核验身份 → 检索证据 → 对比能力与风险 → 输出建议和证据账本。</p><p>Give a subject and decision question → verify identity → gather evidence → compare capabilities and risks → deliver recommendations and an evidence ledger.</p><p>公开仓库提供安装与使用方式；需要在兼容的 Agent 或本地环境中运行。</p><a href="https://github.com/flicy/enterprise-company-research-agent">打开产品 / Open product</a></main></noscript>
