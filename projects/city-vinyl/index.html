<noscript><main><h1>城市唱片 · 把生活片段写成歌</h1><p>从三段生活片段出发，做一张可以分享的城市唱片。</p><h2>适合谁 / Audience</h2><p>喜欢用音乐记录当天情绪、城市与生活瞬间的人。</p><p>People who want to capture daily moods, cities and moments through music.</p><h2>怎么用 / How it works</h2><p>抽取或选择生活场景 → 组合歌词与音乐描述 → 尝试生成完整曲目 → 保存与分享唱片。</p><p>Draw or choose life scenes → combine lyric and music prompts → try generating a complete track → save and share the record.</p><p>界面可体验；音乐生成依赖外部服务。项目页面原名「五月天城市唱片」，不代表官方合作或音乐版权授权。</p><a href="https://flicy.github.io/cola-pages/mayday-city-vinyl/">打开产品 / Open product</a></main></noscript>
